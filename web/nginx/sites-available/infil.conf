log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

server {
  server_name pico_infil_server;

  location /static/ {
    alias /var/www/infil/web/appstatic/;
    expires 1d;
    add_header Cache-Control "public";
  }

  location /pico-infil-live-data {
    proxy_pass http://unix:/run/infilUI/infil.sock;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
  }

  access_log /var/log/infilUI/access.log detailed;
  error_log /var/log/infilUI/error.log warn;

  listen 4499;

  # if you have a cert
  # listen 4499 ssl;
  # ssl_certificate /path/to/ssl/cert/fullchain.pem; # managed by Certbot
  # ssl_certificate_key /path/to/ssl/key/privkey.pem; # managed by Certbot
  # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

