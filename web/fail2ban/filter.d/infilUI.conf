failregex = ^<HOST> .* "[A-Z]+ \S+ HTTP/[\d.]+" 404 \d+

# don't count missing static assets (broken favicon/css links are normal)
ignoreregex = ^<HOST> .*"(?:GET|HEAD) \S+\.(?:css|js|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)(?:\?\S*)? HTTP

